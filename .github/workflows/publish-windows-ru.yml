name: Publish Windows RU Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-windows-ru.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish Windows RU release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Download ffmpeg binaries
        shell: bash
        run: bash scripts/download-ffmpeg.sh x86_64-pc-windows-msvc

      - name: Build Windows installer
        run: bun run tauri build --target x86_64-pc-windows-msvc

      - name: Prepare release installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          Copy-Item $installer.FullName "IPTV.Checker.RU_2.1.0_x64_setup.exe"

      - name: Create or update public GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v2.1.0-ru1"
          $asset = "IPTV.Checker.RU_2.1.0_x64_setup.exe"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $asset --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "IPTV Checker RU 2.1.0" --notes "Русифицированная Windows x64 версия IPTV Checker 2.1.0. Русский язык включён по умолчанию, английский можно выбрать в настройках. Установщик собран автоматически из ветки main этого fork." --latest
          }
